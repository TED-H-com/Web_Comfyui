name: Source and privacy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-lock-primitive:
    # Deliberately scoped: the full launcher still requires Linux/WSL2.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements-webui.txt
      - name: Cross-process file locks and public configuration names
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:USERPROFILE ("agent-work/tmp/pytest/locks-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          try {
            python -m pytest -q "--basetemp=$testTemp/bt" tests/test_file_lock.py tests/test_config_env.py
            $testExit = $LASTEXITCODE
          } finally {
            Remove-Item -Recurse -Force $testTemp
          }
          exit $testExit
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest -r requirements-webui.txt
      - run: python scripts/check_public_release.py
      - run: python scripts/community_workflows.py validate
      - run: python scripts/build_docs.py && python scripts/check_public_release.py --root .site
      - name: CPU tests on disk
        shell: bash
        run: |
          mkdir -p "$HOME/agent-work/tmp/pytest"
          test_tmp="$(mktemp -d "$HOME/agent-work/tmp/pytest/public-ci-XXXXXX")"
          trap 'rm -rf "$test_tmp"' EXIT
          python -m pytest -q --basetemp="$test_tmp/bt" tests scripts/test_app_guide_catalog.py scripts/test_app_graph_catalog.py scripts/test_hardware_catalog.py scripts/test_demo_catalog.py scripts/test_guide_translations.py scripts/test_i18n_browser.py scripts/test_community_workflows.py scripts/test_moss_trainer.py scripts/test_workflow_library.py scripts/test_workflow_guides.py scripts/test_autoip_oct22.py scripts/test_autoip_contract.py scripts/test_autoip_worker.py scripts/test_autoip_quote.py scripts/test_provider_autoip_profiles.py
      - name: JavaScript syntax
        run: |
          node --check webui/static/app.js
          node --check webui/static/workflow-library.js
          node --check webui/docs/docs.js
          node --check webui/docs/explorers.js
          node --check webui/docs/tour.js
          node --check webui/docs/character-session.js
          node --check webui/static/i18n.js
          node --check webui/static/translations-en.js
          node --check webui/static/guide-translations-en.js
          node --check webui/docs/landing.js
          node --check webui/docs/hardware.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest playwright Pillow
      - name: Use the runner browser or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/browser-bin"
            ln -s "$(command -v google-chrome)" "$RUNNER_TEMP/browser-bin/chromium"
            echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Interactive guide at real mobile, tablet and desktop viewports
        shell: bash
        run: |
          mkdir -p "$HOME/agent-work/tmp/pytest"
          browser_test_tmp="$(mktemp -d "$HOME/agent-work/tmp/pytest/browser-ci-XXXXXX")"
          trap 'rm -rf "$browser_test_tmp"' EXIT
          python -m pytest -q --basetemp="$browser_test_tmp/bt" scripts/test_docs_browser.py scripts/test_landing_browser.py scripts/test_tour_browser.py scripts/test_explorers_browser.py
